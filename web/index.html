<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32-dark.png" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <title>Sim Atlanta</title>
    <meta name="description" content="A little model of Atlanta: its trains, buses, traffic and weather, right now." />
    <link rel="canonical" href="https://atlanta.solomon.io/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Sim Atlanta">
    <meta property="og:description" content="A little model of Atlanta: its trains, buses, traffic and weather, right now.">
    <meta property="og:image" content="https://atlanta.solomon.io/previews/default.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sim Atlanta">
    <meta name="twitter:description" content="A little model of Atlanta: its trains, buses, traffic and weather, right now.">
    <meta name="twitter:image" content="https://atlanta.solomon.io/previews/default.jpg">
  </head>
  <body>
    <div id="map" role="application" aria-label="Rail map"></div>

    <section id="view3d" hidden aria-label="Atlanta in 3D">
      <div id="view3d-canvas"></div>
      <!-- City puts its "Show full board" retry here; the A2c menu offers it (ui/next/shell.ts). -->
      <div id="city-info" hidden></div>
      <div id="city-loading" role="status" hidden>
        <p>Atlanta, in miniature</p>
        <span id="city-progress">Loading buildings, streets and trees…</span>
        <small class="city-source">© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a></small>
        <a id="early-map" href="?view=map" hidden>Open Map</a>
      </div>
    </section>

    <aside id="card" class="glass" hidden aria-live="polite">
      <button class="close" type="button" aria-label="Close">×</button>
      <div id="card-content"></div>
      <div id="train-follow" hidden>
        <p class="follow-status" hidden></p>
        <button type="button" data-follow>Follow train</button>
        <button type="button" data-recenter hidden>Recenter</button>
      </div>
    </aside>

    <script type="module" src="/src/start.ts"></script>
  </body>
</html>
