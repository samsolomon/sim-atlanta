<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sim Atlanta</title>
    <meta name="description" content="A little model of Atlanta: its trains, buses, traffic and weather, right now." />
  </head>
  <body>
    <div id="map" role="application" aria-label="Rail map"></div>

    <section id="view3d" hidden aria-label="Atlanta in 3D">
      <div id="view3d-canvas"></div>
      <!-- City puts its "Show full board" retry here; the A2c menu offers it (ui/next/shell.ts). -->
      <div id="city-info" hidden></div>
      <div id="city-loading" role="status" hidden>
        <p>Atlanta, in miniature</p>
        <span id="city-progress">Loading buildings, streets and trees…</span>
        <small class="city-source">© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a></small>
        <a id="early-map" href="?view=map" hidden>Open Map</a>
      </div>
    </section>

    <aside id="card" class="glass" hidden aria-live="polite">
      <button class="close" type="button" aria-label="Close">×</button>
      <div id="card-content"></div>
      <div id="train-follow" hidden>
        <p class="follow-status" hidden></p>
        <button type="button" data-follow>Follow train</button>
        <button type="button" data-recenter hidden>Recenter</button>
      </div>
    </aside>

    <script type="module" src="/src/start.ts"></script>
  </body>
</html>
