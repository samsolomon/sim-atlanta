<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Atlanta, in miniature</title>
    <meta name="description" content="A little model of Atlanta: its trains, buses, traffic and weather, right now." />
  </head>
  <body>
    <div id="map" role="application" aria-label="Rail map"></div>

    <!-- Time controls: kept for later, hidden unless ?controls=1 (see main.ts). -->
    <section id="timectl" class="timectl glass" hidden aria-label="Time">
      <p class="clock"><time id="clock">--:--</time> <span id="clock-note">now</span></p>
      <input id="scrub" type="range" min="-720" max="720" step="5" value="0" aria-label="Shift time (minutes)" />
      <div class="scrub-row">
        <button id="now" type="button">Now</button>
        <div class="speed" role="group" aria-label="Playback speed">
          <button type="button" data-speed="1" aria-pressed="true">1×</button>
          <button type="button" data-speed="30" aria-pressed="false">30×</button>
        </div>
      </div>
    </section>

    <section id="view3d" hidden aria-label="Downtown Atlanta in 3D">
      <div id="view3d-canvas"></div>
      <div id="city-loading" role="status" hidden>
        <p>Downtown, in miniature</p>
        <span id="city-progress">Loading buildings, streets and trees…</span>
        <a id="early-map" href="?view=map" hidden>Open Map</a>
      </div>
      <p class="attrib3d">Unofficial · Buildings &amp; track © OpenStreetMap contributors, Overture Maps · <span id="city-ground-source">Flat board</span> · MARTA data · Rail and bridge heights are schematic<span id="city-freight-attrib" hidden> · Illustrative freight loop</span><span id="city-traffic-attrib" hidden> · Illustrative road traffic</span></p>
    </section>

    <aside id="card" class="glass" hidden aria-live="polite">
      <button class="close" type="button" aria-label="Close">×</button>
      <div id="card-content"></div>
    </aside>

    <script type="module" src="/src/start.ts"></script>
  </body>
</html>
