<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>East Portal Diorama · Sim Atlanta</title>
    <style>
      html, body { margin: 0; height: 100%; background: #e7e2d8; font: 14px/1.4 system-ui, -apple-system, sans-serif; color: #2a2722; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .plate { position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); background: rgba(251, 249, 244, .9); border-radius: 6px; padding: 10px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); max-width: 320px; }
      .plate b { display: block; font-size: 15px; }
      .plate span { color: #6b665c; font-size: 12.5px; }
      body.clean .plate, body.clean #readout { display: none; }
      #readout { position: fixed; right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); background: rgba(251, 249, 244, .9); border-radius: 6px; padding: 8px 12px; font-size: 12.5px; display: grid; gap: 2px; max-width: 340px; }
      #readout span { color: #6b665c; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="readout"></div>
    <div class="plate"><b>East Portal, Atlanta</b><span>MARTA leaves the tunnel beside the freight main and crosses the Downtown Connector. Trains on an illustrative loop. Drag to orbit.</span></div>
    <script>if (new URLSearchParams(location.search).has('clean')) document.body.classList.add('clean');</script>
    <script type="module" src="/src/vignette/main.ts"></script>
  </body>
</html>
