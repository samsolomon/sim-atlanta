# Tests and the web build on every pull request and push to main. No secrets: nothing here needs a
# MARTA or 511GA key, and nothing deploys. Not covered: the share preview images, `pnpm test:perf`,
# visual checks and device runs (see AGENTS.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pipeline/target
          key: cargo-${{ runner.os }}-${{ hashFiles('pipeline/Cargo.lock', 'pipeline/src/**') }}
          restore-keys: cargo-${{ runner.os }}-

      # The map data comes from live public sources (GTFS, FRA, BTS, Overture, USGS). It is cached
      # until something that produces it changes, so a source being down or publishing a new feed
      # does not turn an unrelated pull request red. GitHub drops a cache unused for seven days.
      # The key is computed before anything is built or downloaded.
      - name: Restore map data
        id: data
        uses: actions/cache/restore@v6
        with:
          path: |
            data/raw
            web/public/data
          key: map-data-v1-${{ hashFiles('package.json', '.github/requirements-ci.txt', 'pipeline/Cargo.lock', 'pipeline/src/**', 'pipeline/scripts/**', 'pipeline/prototypes/**', 'scripts/stage-*.mjs') }}

      - run: pnpm install --frozen-lockfile

      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r .github/requirements-ci.txt

      - name: Build map data
        if: steps.data.outputs.cache-hit != 'true'
        run: |
          pnpm data
          pnpm data:vignette

      # Saved before the tests, so a failing test does not make the next run download it all again.
      - name: Save map data
        if: steps.data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            data/raw
            web/public/data
          key: ${{ steps.data.outputs.cache-primary-key }}

      # Data tests skip themselves when files are missing; make that impossible here.
      - name: Check the map data is present
        run: |
          test -s web/public/data/ga/routes.json
          test -s web/public/data/ga/timetable.json
          test -s web/public/data/scene/square-board/r16/context.json

      - name: Tests (Rust, pipeline, web, Worker)
        run: pnpm test:release

      - name: Type check and build
        run: pnpm --filter web build:app
