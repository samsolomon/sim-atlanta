[package]
name = "railprep"
version = "0.1.0"
edition = "2021"
description = "Builds static rail data (GTFS timetables, FRA crossings, NARN freight lines) for the train map"

[dependencies]
ring = "0.17"
anyhow = "1"
earcutr = "0.4"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
