<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time and weather, phone</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.root{position:relative;width:390px;height:844px;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ink:#2a2722;--ink2:#5f5a50;--ga:rgba(252,250,245,.88);--gb:rgba(243,239,230,.80);--hair:rgba(60,45,30,.18);--rim:rgba(255,255,255,.9);--sh:0 10px 28px rgba(40,30,20,.18),0 1px 3px rgba(40,30,20,.10);--sep:rgba(60,45,30,.12);color:var(--ink)}
.g{position:absolute;box-sizing:border-box;background:linear-gradient(160deg,var(--ga),var(--gb));-webkit-backdrop-filter:blur(22px) saturate(1.35);backdrop-filter:blur(22px) saturate(1.35);border-radius:16px;box-shadow:0 0 0 .5px var(--hair),var(--sh),inset 0 1px 0 var(--rim)}
.ib{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);padding:0;border-radius:10px;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
.sep{height:1px;background:var(--sep);margin:0 8px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.seg{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--sep)}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:transparent;color:var(--ink);font:600 14px system-ui;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(40,30,20,.16),0 0 0 .5px rgba(60,45,30,.12)}
.h{margin:16px 0 7px;font-size:13px;font-weight:600;color:var(--ink2)}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div class="root">
  <img src="/_blob/79735a4af92dc0ab41b97c9971075f37" alt="Downtown Atlanta diorama by day" style="position:absolute;inset:0;width:390px;height:844px;object-fit:cover">

  <div class="g" style="left:8px;right:60px;top:54px;padding:12px 16px">
    <span style="display:block;font-size:22px;font-weight:700;letter-spacing:-.01em">Castleberry Hill</span>
    <span style="display:flex;align-items:center;gap:8px;margin-top:5px;font-size:14px"><strong>Fri 4:30 PM</strong>Clear<span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2)"><span class="dot" style="background:#2b6cb0"></span>Timetable</span></span>
  </div>
  <div class="g" style="right:8px;top:54px;width:44px;display:flex;flex-direction:column;padding:2px 0">
    <button class="ib" aria-label="Compass"><svg viewBox="0 0 32 32" aria-hidden="true" style="width:30px;height:30px"><circle cx="16" cy="16" r="13" style="stroke-width:1.2"></circle><g transform="rotate(-21 16 16)"><path d="M16 5l3.2 11h-6.4z" style="fill:#c2255c;stroke:none"></path><path d="M16 27l3.2-11h-6.4z" style="fill:currentColor;stroke:none;opacity:.55"></path></g></svg></button>
    <div class="sep"></div>
    <button class="ib" aria-label="Share this view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="M7.5 7.5L12 3l4.5 4.5"></path><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg></button>
  </div>

  <section class="g" aria-label="Time and weather" style="left:8px;right:8px;bottom:8px;border-radius:24px;padding:8px 18px 24px">
    <div aria-hidden="true" style="width:40px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 12px"></div>
    <div style="display:flex;align-items:center;gap:10px">
      <h2 style="flex:1;margin:0;font-size:20px">Time &amp; weather</h2>
      <button class="ib" aria-label="Close" style="width:34px;height:34px;border-radius:50%;background:var(--sep)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <p class="h" style="display:flex;justify-content:space-between"><span>Fri, Nov 20 · 4:30 PM</span><span style="font-weight:500">Now · 2:04 PM</span></p>
    <div style="position:relative;height:36px">
      <div style="position:absolute;left:0;right:0;top:16px;height:4px;border-radius:2px;background:var(--sep)"></div>
      <div style="position:absolute;left:50%;width:10%;top:16px;height:4px;border-radius:2px;background:#2a2722"></div>
      <div style="position:absolute;left:50%;top:10px;width:2px;height:16px;background:var(--ink2);opacity:.6"></div>
      <div role="slider" aria-label="Time" aria-valuetext="4:30 PM" style="position:absolute;left:calc(60% - 14px);top:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35),0 0 0 .5px rgba(60,45,30,.2)"></div>
    </div>
    <p class="h">Speed</p>
    <div class="seg" role="group" aria-label="Speed"><button aria-pressed="false" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M8 5v14M16 5v14"></path></svg></button><button aria-pressed="true">1×</button><button aria-pressed="false">30×</button></div>
    <p class="h">Weather</p>
    <div class="seg" role="group" aria-label="Weather"><button aria-pressed="true">Auto</button><button aria-pressed="false">Clear</button><button aria-pressed="false">Rain</button><button aria-pressed="false">Fog</button><button aria-pressed="false">Storm</button></div>
    <p style="margin:8px 0 0;font-size:12px;color:var(--ink2)">Trains from the timetable and an illustrative sky until you go back to now.</p>
    <button style="width:100%;height:44px;margin-top:14px;border:0;border-radius:12px;background:var(--sep);color:var(--ink);font:600 15px system-ui;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:17px;height:17px"><path d="M4 12a8 8 0 1 0 3-6.2"></path><path d="M4 4v4h4"></path></svg>Back to now</button>
  </section>
</div>
