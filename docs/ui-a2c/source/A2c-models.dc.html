<style>
body{margin:0}
.root{position:relative;width:1296px;height:726px;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ink:#2a2722;--ink2:#5f5a50;--ga:rgba(252,250,245,.84);--gb:rgba(243,239,230,.74);--hair:rgba(60,45,30,.18);--rim:rgba(255,255,255,.9);--sh:0 10px 28px rgba(40,30,20,.18),0 1px 3px rgba(40,30,20,.10);--sep:rgba(60,45,30,.12);color:var(--ink);background:#efe6d2}
.g{position:absolute;box-sizing:border-box;background:linear-gradient(160deg,var(--ga),var(--gb));-webkit-backdrop-filter:blur(22px) saturate(1.35);backdrop-filter:blur(22px) saturate(1.35);border-radius:16px;box-shadow:0 0 0 .5px var(--hair),var(--sh),inset 0 1px 0 var(--rim)}
.ib{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);padding:0;border-radius:10px;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
.sep{height:1px;background:var(--sep);margin:0 8px}
.vsep{width:1px;align-self:stretch;margin:10px 4px;background:var(--sep)}
.vs{height:36px;border:0;border-radius:9px;padding:0 12px;font:600 14px system-ui;background:transparent;color:var(--ink);cursor:pointer}
.vs[aria-pressed="true"]{background:rgba(255,255,255,.95);color:var(--ink);box-shadow:0 1px 3px rgba(40,30,20,.16),0 0 0 .5px rgba(60,45,30,.12)}
.chip{height:30px;border:0;border-radius:999px;padding:0 12px;font:600 13px system-ui;background:var(--sep);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(40,30,20,.16),0 0 0 .5px rgba(60,45,30,.12)}
.h{margin:14px 0 6px;font-size:12px;font-weight:600;color:var(--ink2)}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--sep)}
.seg button{flex:1;height:30px;border:0;border-radius:8px;background:transparent;color:var(--ink);font:600 13px system-ui;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(40,30,20,.16),0 0 0 .5px rgba(60,45,30,.12)}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.tog{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:6px 0}
.sx{width:38px;height:22px;border-radius:11px;background:var(--sep);position:relative;flex:none}
.sx.on{background:#2a2722}
.sx i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sx.on i{left:18px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>

    <span style="display:block;margin-top:8px;font-size:12px;font-weight:600;color:var(--ink2)">Vehicles · 1 of 3</span>
  </div>

  <div class="g" style="left:8px;bottom:8px;height:48px;display:flex;align-items:center;gap:2px;padding:0 4px 0 2px">

    <button class="ib" aria-label="Reset view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2"></path><path d="M4 4v4h4"></path></svg></button>
    <div class="sep"></div>

    <button class="ib" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>

  </div>

  <aside class="g" aria-label="Model controls" style="right:8px;top:8px;width:312px;padding:14px 16px 16px">

    <p class="h">Camera</p>
    <div class="seg" role="group" aria-label="Camera"><button aria-pressed="false">Front</button><button aria-pressed="true">Side</button><button aria-pressed="false">Rear</button><button aria-pressed="false">Top</button></div>

    <div class="seg" role="group" aria-label="Line colour"><button aria-pressed="false"><span class="sw" style="background:#d22030"></span>Red</button><button aria-pressed="true"><span class="sw" style="background:#e0a400"></span>Gold</button><button aria-pressed="false"><span class="sw" style="background:#1f5fd1"></span>Blue</button><button aria-pressed="false"><span class="sw" style="background:#2f9e44"></span>Green</button></div>
    <p class="h">Platform</p>
    <div class="seg" role="group" aria-label="Platform"><button aria-pressed="true">None</button><button aria-pressed="false">Island</button><button aria-pressed="false">Side</button></div>
    <p class="h">Display</p>
    <div class="tog"><span>Night</span><span class="sx" role="switch" aria-checked="false" aria-label="Night"><i></i></span></div>
    <div class="tog"><span>Ink outlines</span><span class="sx on" role="switch" aria-checked="true" aria-label="Ink outlines"><i></i></span></div>
  </aside>
</div>
