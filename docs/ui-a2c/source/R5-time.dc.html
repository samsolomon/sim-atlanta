<style>
body{margin:0}
.root{position:relative;width:1296px;height:726px;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ink:#2a2722;--ink2:#5f5a50;--ga:rgba(252,250,245,.86);--gb:rgba(243,239,230,.78);--hair:rgba(60,45,30,.18);--rim:rgba(255,255,255,.9);--sh:0 10px 28px rgba(40,30,20,.18),0 1px 3px rgba(40,30,20,.10);--sep:rgba(60,45,30,.12);color:var(--ink)}
.g{position:absolute;box-sizing:border-box;background:linear-gradient(160deg,var(--ga),var(--gb));-webkit-backdrop-filter:blur(22px) saturate(1.35);backdrop-filter:blur(22px) saturate(1.35);border-radius:16px;box-shadow:0 0 0 .5px var(--hair),var(--sh),inset 0 1px 0 var(--rim)}
.ib{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);padding:0;border-radius:10px;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
.sep{height:1px;background:var(--sep);margin:0 8px}
.vsep{width:1px;align-self:stretch;margin:10px 4px;background:var(--sep)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.vs{height:36px;border:0;border-radius:9px;padding:0 12px;font:600 14px system-ui;background:transparent;color:var(--ink);cursor:pointer}
.vs[aria-pressed="true"],.seg button[aria-pressed="true"]{background:rgba(255,255,255,.95);color:var(--ink);box-shadow:0 1px 3px rgba(40,30,20,.16),0 0 0 .5px rgba(60,45,30,.12)}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--sep)}
.seg button{flex:1;height:30px;border:0;border-radius:8px;background:transparent;color:var(--ink);font:600 13px system-ui;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.h{margin:14px 0 6px;font-size:12px;font-weight:600;color:var(--ink2)}
.link{border:0;background:none;padding:0;font:600 12px system-ui;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div class="root">
  <img src="/_blob/378ac95adb6dc8c1d716b2ee8eadba49" alt="Downtown Atlanta diorama by day" style="position:absolute;inset:0;width:1296px;height:726px;object-fit:cover">

    </button>
    <span style="display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;color:var(--ink2)"><span class="dot" style="background:#2b6cb0"></span>Timetable · illustrative sky</span>

    <div class="sep" style="margin:14px 0 0"></div>

    <p class="h" style="display:flex;justify-content:space-between;align-items:center"><span>Time</span><button class="link" style="display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-weight:600"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Fri, Nov 20</button></p>
    <div style="position:relative;height:28px">
      <div style="position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:var(--sep)"></div>

      <div role="slider" aria-label="Time" aria-valuetext="4:30 PM" style="position:absolute;left:calc(60% - 11px);top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35),0 0 0 .5px rgba(60,45,30,.2)"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink2)"><span>−12 h</span><span>Now · 2:04 PM</span><span>+12 h</span></div>

    <p class="h">Speed</p>
    <div class="seg" role="group" aria-label="Speed"><button aria-pressed="false" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:13px;height:13px"><path d="M8 5v14M16 5v14"></path></svg></button><button aria-pressed="true">1×</button><button aria-pressed="false">30×</button></div>

    <p class="h">Weather</p>
    <div class="seg" role="group" aria-label="Weather"><button aria-pressed="true">Auto</button><button aria-pressed="false">Clear</button><button aria-pressed="false">Rain</button><button aria-pressed="false">Fog</button><button aria-pressed="false">Storm</button></div>
    <p style="margin:7px 0 0;font-size:12px;color:var(--ink2);line-height:1.4">Auto shows the observed weather at the present time and an illustrative sky otherwise.</p>

    <button style="width:100%;height:38px;margin-top:14px;border:0;border-radius:10px;background:var(--sep);color:var(--ink);font:600 14px system-ui;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M4 12a8 8 0 1 0 3-6.2"></path><path d="M4 4v4h4"></path></svg>Back to now</button>
  </section>

  <div class="g" style="left:8px;bottom:8px;height:48px;display:flex;align-items:center;gap:2px;padding:0 4px 0 2px">
    <button class="ib" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <span class="vsep"></span>
    <span role="group" aria-label="View" style="display:flex;gap:2px;padding:2px;border-radius:11px;background:var(--sep)"><button class="vs" aria-pressed="false">Map</button><button class="vs" aria-pressed="true">City</button><button class="vs" aria-pressed="false">Models</button></span>
    <span class="vsep"></span>
    <button class="ib" aria-label="Play radio" style="width:40px;height:40px"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M9 18V6l11-2v12"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg></button>
  </div>

  <div class="g" style="right:8px;bottom:8px;width:44px;display:flex;flex-direction:column;padding:2px 0">
    <button class="ib" aria-label="Compass"><svg viewBox="0 0 32 32" aria-hidden="true" style="width:30px;height:30px"><circle cx="16" cy="16" r="13" style="stroke-width:1.2"></circle><g transform="rotate(-21 16 16)"><path d="M16 5l3.2 11h-6.4z" style="fill:#c2255c;stroke:none"></path><path d="M16 27l3.2-11h-6.4z" style="fill:currentColor;stroke:none;opacity:.55"></path></g></svg></button>
    <div class="sep"></div>
    <button class="ib" aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    <button class="ib" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
    <div class="sep"></div>
    <button class="ib" aria-label="Share this view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="M7.5 7.5L12 3l4.5 4.5"></path><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg></button>
  </div>
</div>
