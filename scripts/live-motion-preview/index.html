<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>40-second MARTA motion preview</title>
<style>
body{margin:8vh auto;padding:0 5vw;max-width:850px;background:#faf8f4;color:#252932;font:18px/1.5 system-ui}
h1{font-size:clamp(26px,5vw,42px);margin:0}svg{width:100%;background:#e9e5dc;border-radius:6px;margin:1em 0}button,select{font:inherit;padding:.3em .65em}output{font-variant-numeric:tabular-nums}input{width:100%}
</style>
<!-- Serve the repo root with `npx vite` (from web/: `npx vite ..`) and open /scripts/live-motion-preview/; Vite compiles the TypeScript import. --><h1>MARTA motion study</h1><p>Fixture train 101 · 40-second display delay · schematic track</p>
<svg viewBox="0 0 800 160" aria-label="Selected train on a schematic track"><path d="M30 85 H770" stroke="#737570" stroke-width="5"/><path d="M465 99 h82" stroke="#898f84" stroke-width="11"/><text x="465" y="138" font-size="16">Station</text><g id="car" fill="#2878aa"><rect x="-20" y="68" width="40" height="21" rx="3"/><path d="M-14 73h27" stroke="white" stroke-width="4"/></g></svg>
<p><output id="info"></output></p>
<label>Replay time <input id="seek" type="range" min="30" max="210" step=".1" value="60"></label>
<button id="pause">Pause</button> <button id="restart">Replay approach</button> <label>Speed <select id="rate"><option>1</option><option selected>4</option><option>8</option></select>×</label>
<p>Reports arrive every 30 seconds. The train reaches the station at replay time 130 s, dwells for 30 s, and then departs. All positions are synthetic.</p>
<script type="module">
import {appendReservedFix,RESERVE_DELAY_MS,playback} from '../../web/src/live/motion.ts';
const positions=[0,200,400,600,600,800,900];
let time=60, running=true, last=performance.now();
function position(t){
 const history=[];
 for(let i=0;i<positions.length && i*30<=t;i++) appendReservedFix(history,positions[i],30000*i);
 return playback(history,t*1000,RESERVE_DELAY_MS);
}
function frame(now){
 if(running)time=Math.min(210,time+(now-last)/1000*Number(rate.value));
 last=now;
 if(time===210)running=false;
 const s=position(time);
 car.setAttribute('transform','translate('+(30+s*740/900)+' 0)');
 info.textContent=time.toFixed(1)+' s · '+s.toFixed(1)+' m · '+((position(time+.02)-s)/.02).toFixed(1)+' m/s';
 seek.value=time;pause.textContent=running?'Pause':'Play';
 requestAnimationFrame(frame);
}
pause.onclick=()=>{if(time===210)time=30;running=!running};
restart.onclick=()=>{time=60;running=true};
seek.oninput=()=>{time=Number(seek.value)};
requestAnimationFrame(frame);
</script></html>
