name = "railwatch"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# The static site is served from web/dist; only /api/* runs the Worker first.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Secret (not in this file): MARTA_API_KEY
#   production: wrangler secret put MARTA_API_KEY
#   local dev:  worker/.dev.vars  (gitignored)
